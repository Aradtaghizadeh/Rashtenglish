<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Class Schedule | RashtEnglish</title>

    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            padding: 40px 20px;

            font-family:
                Arial,
                sans-serif;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #111827,
                    #1e3a5f,
                    #312e81
                );

        }


        .container {

            max-width: 1200px;

            margin: auto;

        }


        .glass {

            background:
                rgba(255,255,255,.10);

            border:
                1px solid
                rgba(255,255,255,.20);

            backdrop-filter:
                blur(18px);

            -webkit-backdrop-filter:
                blur(18px);

            border-radius: 25px;

            box-shadow:
                0 20px 60px
                rgba(0,0,0,.3);

        }


        .header {

            padding: 30px;

            text-align: center;

            margin-bottom: 25px;

        }


        .header h1 {

            margin: 0;

        }


        .table-container {

            padding: 20px;

            overflow-x: auto;

        }


        table {

            width: 100%;

            border-collapse:
                separate;

            border-spacing: 0 10px;

        }


        th {

            text-align: left;

            padding: 15px;

            opacity: .7;

        }


        td {

            padding: 18px 15px;

            background:
                rgba(255,255,255,.08);

        }


        td:first-child {

            border-radius:
                14px 0 0 14px;

        }


        td:last-child {

            border-radius:
                0 14px 14px 0;

        }


        .empty {

            text-align: center;

            padding: 40px;

            opacity: .7;

        }

    </style>

</head>


<body>


<div class="container">


    <div class="glass header">

        <h1>Class Schedule</h1>

        <p>
            Students and their selected class times
        </p>

    </div>


    <div class="glass table-container">

        <table>

            <thead>

                <tr>

                    <th>Student</th>

                    <th>Email</th>

                    <th>Day</th>

                    <th>Time</th>

                    <th>Selected At</th>

                </tr>

            </thead>

            <tbody id="scheduleBody">

            </tbody>

        </table>

    </div>

</div>


<script src="./static/js/teacher-schedule.js"></script>

</body>

</html>

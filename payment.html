<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment | RashtEnglish</title>
<link rel="stylesheet" href="./static/styles/day-night2.css">
<style>
*{box-sizing:border-box}
body{margin:0}
.payment-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px}
.payment-card{width:min(540px,100%);padding:34px;border-radius:30px;background:rgba(255,255,255,.11);border:1px solid rgba(255,255,255,.25);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);box-shadow:0 30px 80px rgba(0,0,0,.25)}
.payment-card h1{margin:0 0 8px;text-align:center}
.subtitle{text-align:center;opacity:.62;font-size:14px}
.amount-box{margin:26px 0;padding:20px;border-radius:20px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);text-align:center}
.amount-label{display:block;font-size:12px;opacity:.55}
.amount{display:block;margin-top:7px;font-size:31px;font-weight:850}
.order{margin-top:8px;font-size:12px;opacity:.48;word-break:break-all}
.expiry{margin-top:8px;font-size:12px;opacity:.55}
.status{margin:16px 0;padding:13px 15px;border-radius:15px;background:rgba(255,255,255,.07);font-size:13px;line-height:1.5;text-align:center}
.status.error{background:rgba(255,80,80,.10);border:1px solid rgba(255,120,120,.22)}
.status.success{background:rgba(34,197,94,.10);border:1px solid rgba(134,239,172,.25)}
.pay-button,.back-button{width:100%;display:block;padding:15px;border-radius:15px;border:1px solid rgba(255,255,255,.27);font:inherit;font-weight:750;text-align:center;text-decoration:none;cursor:pointer}
.pay-button{background:rgba(255,255,255,.15);color:inherit}
.pay-button:hover:not(:disabled){background:rgba(255,255,255,.23)}
.pay-button:disabled{opacity:.35;cursor:not-allowed}
.back-button{margin-top:11px;color:inherit;background:rgba(255,255,255,.06)}
.dev-note{margin-top:20px;padding:13px;border-radius:15px;background:rgba(245,158,11,.09);border:1px solid rgba(245,158,11,.20);font-size:11px;line-height:1.55;opacity:.78}
.hidden{display:none}
</style>
</head>
<body>
<main class="payment-page">
<section class="payment-card">
    <h1>Payment</h1>
    <p class="subtitle">Review your order before continuing.</p>

    <div class="amount-box">
        <span class="amount-label">Amount to pay</span>
        <span id="amount" class="amount">Loading...</span>
        <div id="order" class="order"></div>
        <div id="expiry" class="expiry"></div>
    </div>

    <div id="status" class="status">Loading your payment order...</div>

    <button id="payButton" class="pay-button" type="button" disabled>
        Continue to Secure Payment
    </button>

    <a href="book-class.html" class="back-button">
        ← Back to booking
    </a>

    <div id="devNote" class="dev-note hidden">
        Development mode: the real Shaparak/PSP gateway is not connected yet.
        The button below completes a test payment only and must not be used in production.
    </div>

    <button id="devButton" class="pay-button hidden" type="button" style="margin-top:11px;">
        Complete Test Payment
    </button>
</section>
</main>

<script>
const API_BASE = "http://localhost:3000/api";
const token = localStorage.getItem("token");

if (!token) {
    window.location.href = "login.html";
}

const params = new URLSearchParams(window.location.search);
const orderId = params.get("orderId");

const amountEl = document.getElementById("amount");
const orderEl = document.getElementById("order");
const expiryEl = document.getElementById("expiry");
const statusEl = document.getElementById("status");
const payButton = document.getElementById("payButton");
const devButton = document.getElementById("devButton");
const devNote = document.getElementById("devNote");

function money(value) {
    return new Intl.NumberFormat("en-US").format(Number(value || 0)) + " Toman";
}

function setStatus(message, type = "") {
    statusEl.textContent = message;
    statusEl.className = "status" + (type ? " " + type : "");
}

async function api(url, options = {}) {
    const response = await fetch(url, {
        ...options,
        headers: {
            ...(options.headers || {}),
            Authorization: `Bearer ${token}`,
            "Content-Type": "application/json"
        }
    });

    const data = await response.json().catch(() => ({}));

    if (!response.ok) {
        throw new Error(data.message || "Request failed.");
    }

    return data;
}

function showOrder(order) {
    amountEl.textContent = money(order.total_price);
    orderEl.textContent = "Order: " + order.id;

    if (order.expires_at) {
        const expiry = new Date(order.expires_at);
        expiryEl.textContent =
            "Reservation expires: " +
            expiry.toLocaleString([], {
                dateStyle: "medium",
                timeStyle: "short"
            });
    }

    if (order.status === "paid") {
        setStatus("Payment completed successfully. Your sessions are now paid.", "success");
        payButton.disabled = true;
        payButton.textContent = "Payment Completed";
        return;
    }

    if (order.status !== "pending") {
        setStatus(`This payment order is ${order.status}.`, "error");
        payButton.disabled = true;
        return;
    }

    setStatus("Your class times are temporarily reserved while payment is completed.");
    payButton.disabled = false;
}

async function loadOrder() {
    if (!orderId) {
        setStatus("No payment order was provided.", "error");
        amountEl.textContent = "—";
        return;
    }

    try {
        const order = await api(
            `${API_BASE}/payment/order/${encodeURIComponent(orderId)}`
        );

        showOrder(order);

        /*
         * This button is only for local development.
         * The backend disables the endpoint when NODE_ENV=production.
         */
        devNote.classList.remove("hidden");
        devButton.classList.remove("hidden");

    } catch (error) {
        console.error(error);
        setStatus(error.message, "error");
        payButton.disabled = true;
    }
}

payButton.addEventListener("click", async () => {
    /*
     * Production:
     * Replace this action with the real PSP redirect returned
     * by your backend after the Shaparak/PSP API is connected.
     */
    setStatus(
        "The secure payment provider is not connected yet. Use the test-payment button while developing.",
        "error"
    );
});

devButton.addEventListener("click", async () => {
    if (!orderId) return;

    devButton.disabled = true;
    devButton.textContent = "Completing...";

    try {
        const result = await api(
            `${API_BASE}/payment/dev-complete/${encodeURIComponent(orderId)}`,
            { method: "POST" }
        );

        if (result.success) {
            setStatus(
                "Test payment completed. Your sessions are now paid.",
                "success"
            );

            payButton.disabled = true;
            payButton.textContent = "Payment Completed";
            devButton.classList.add("hidden");

            setTimeout(() => {
                window.location.href = "book-class.html";
            }, 1200);
        }
    } catch (error) {
        console.error(error);
        setStatus(error.message, "error");
        devButton.disabled = false;
        devButton.textContent = "Complete Test Payment";
    }
});

loadOrder();
</script>
</body>
</html>
